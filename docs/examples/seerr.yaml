# Seerr — media request management
apiVersion: servarr.dev/v1alpha1
kind: ServarrApp
metadata:
  name: seerr
spec:
  app: Seerr
---
# Seerr with auto-sync to discovered Sonarr/Radarr instances
apiVersion: servarr.dev/v1alpha1
kind: ServarrApp
metadata:
  name: seerr
spec:
  app: Seerr
  apiKeySecret: seerr-api-key
  seerrSync:
    enabled: true
    autoRemove: true
  appConfig:
    seerr:
      sonarr:
        profileId: 1
        profileName: "HD-1080p"
        rootFolder: "/tv"
        enableSeasonFolders: true
        fourK:
          profileId: 5
          profileName: "Ultra-HD"
          rootFolder: "/tv4k"
          enableSeasonFolders: true
      radarr:
        profileId: 1
        profileName: "HD-1080p"
        rootFolder: "/movies"
        minimumAvailability: "released"
        fourK:
          profileId: 5
          profileName: "Ultra-HD"
          rootFolder: "/movies4k"
          minimumAvailability: "released"
