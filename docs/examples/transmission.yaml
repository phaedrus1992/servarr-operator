# Minimal Transmission — BitTorrent client
apiVersion: servarr.dev/v1alpha1
kind: ServarrApp
metadata:
  name: transmission
spec:
  app: Transmission
  persistence:
    volumes:
      - name: downloads
        mountPath: /downloads
        size: 100Gi
---
# Transmission with authentication, peer port, and settings override
#
# auth.secretName: references a Secret with "username" and "password" keys
# peerPort: configures the incoming torrent peer port; hostPort binds directly
#           on the node (useful when behind NAT)
# settings: any valid Transmission settings.json key/value pairs, merged into
#           the generated settings file
#
# Create the auth secret:
#   kubectl create secret generic transmission-credentials \
#     --from-literal=username=admin \
#     --from-literal=password=changeme
apiVersion: servarr.dev/v1alpha1
kind: ServarrApp
metadata:
  name: transmission
spec:
  app: Transmission
  persistence:
    volumes:
      - name: downloads
        mountPath: /downloads
        size: 100Gi
  appConfig:
    transmission:
      auth:
        secretName: transmission-credentials
      peerPort:
        port: 51413
        hostPort: true
        randomOnStart: false
      settings:
        speed-limit-up-enabled: true
        speed-limit-up: 500
        ratio-limit-enabled: true
        ratio-limit: 2.0
        download-queue-size: 10
---
# Transmission with API health checking and torrent self-heal
#
# apiHealthCheck: probes the Transmission RPC API. No apiKeySecret is required --
#                 auth comes from adminCredentials. enabled: true also turns on
#                 detection of torrents whose on-disk data has gone missing;
#                 autoRemoveOrphanedTorrents: true additionally removes a torrent's
#                 bookkeeping entry once verify confirms the data is gone (on-disk
#                 files are never deleted). See docs/configuration.md.
apiVersion: servarr.dev/v1alpha1
kind: ServarrApp
metadata:
  name: transmission
spec:
  app: Transmission
  persistence:
    volumes:
      - name: downloads
        mountPath: /downloads
        size: 100Gi
  adminCredentials:
    secretName: transmission-credentials
  apiHealthCheck:
    enabled: true
    intervalSeconds: 60
    autoRemoveOrphanedTorrents: true
