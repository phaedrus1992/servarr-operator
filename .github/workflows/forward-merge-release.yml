name: Forward-merge release branches

on:
  push:
    branches:
      - 'release/**'

# Default to read-only; each job that needs write declares it explicitly.
permissions:
  contents: read

concurrency:
  group: forward-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Does the merge, the build-gate check (#528), and nothing else. No push
  # credentials of any kind — cargo build executes build.rs/proc-macros from
  # the merged tree, and that must never run with a write-capable token in
  # scope (#616). Successful merges are handed to forward-merge as git
  # bundles; this job never touches origin.
  verify-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.cascade.outputs.current }}
      verified_targets: ${{ steps.cascade.outputs.verified_targets }}
      halted: ${{ steps.cascade.outputs.halted }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect release branches
        id: detect
        run: |
          set -euo pipefail
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          # `git branch -r` indents each line with two spaces; strip that (and the
          # `origin/` prefix) before matching, otherwise the cascade compares
          # "  release/1.x" against "release/1.x", never matches the current
          # branch, and aborts with "not a versioned release branch".
          BRANCHES=$(git branch -r | sed 's|^[[:space:]]*origin/||' \
            | grep -E '^release/[0-9]+\.x$' | sort -V)
          # Random delimiter so a branch literally named "EOF" can't break the
          # multiline output value (GitHub-recommended pattern).
          DELIM="branches-$(uuidgen)"
          {
            echo "current=$CURRENT"
            echo "branches<<$DELIM"
            echo "$BRANCHES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Verify cascade
        id: cascade
        env:
          CURRENT: ${{ steps.detect.outputs.current }}
          BRANCHES: ${{ steps.detect.outputs.branches }}
        run: |
          set -euo pipefail

          emit_outputs() {
            local delim
            delim="targets-$(uuidgen)"
            {
              echo "current=$CURRENT"
              echo "halted=${HALTED:-}"
              echo "verified_targets<<$delim"
              printf '%s\n' "${VERIFIED[@]}"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          }

          # Build target list: every newer release branch (semver order) + main.
          TARGETS=()
          FOUND=0
          while IFS= read -r BRANCH; do
            if [[ "$FOUND" -eq 1 ]]; then
              TARGETS+=("$BRANCH")
            fi
            if [[ "$BRANCH" == "$CURRENT" ]]; then
              FOUND=1
            fi
          done <<< "$BRANCHES"

          VERIFIED=()
          HALTED=""

          # Guard: the pushed branch must be a recognized versioned release line.
          # The trigger (release/**) is broader than the X.x regex, so a branch
          # like release/foo would otherwise fall through and merge into main.
          if [[ "$FOUND" -eq 0 ]]; then
            echo "::warning::$CURRENT is not a versioned release/X.x branch; skipping cascade"
            emit_outputs
            exit 0
          fi

          TARGETS+=("main")
          mkdir -p bundles

          # A real conflict needs human resolution — git merge --abort above
          # already discarded the attempted merge, so there is no valid
          # branch left to open a PR from. Bail with manual-resolution
          # instructions instead.
          bail_on_conflict() {
            local src="$1" tgt="$2"
            echo "::error::Merge conflict: $src into $tgt has conflicts. Resolve manually:"
            echo "::error::  git fetch origin && git checkout $tgt && git reset --hard origin/$tgt"
            echo "::error::  git merge origin/$src"
            echo "::error::  # resolve conflicts, then: git push origin $tgt"
          }

          # A merge with no textual conflict can still be semantically broken —
          # e.g. both sides independently changed a function signature on
          # different lines, so `git merge` combines them cleanly but the
          # result doesn't compile (#528). Building the merge result before
          # handing it off catches this; a build failure here is not a git
          # conflict, so the instructions must say so explicitly.
          bail_on_build_failure() {
            local src="$1" tgt="$2"
            echo "::error::Build failed after merging $src into $tgt (not a git conflict — the merge itself is clean, but the combined code doesn't compile). Resolve manually:"
            echo "::error::  git fetch origin && git checkout $tgt && git reset --hard origin/$tgt"
            echo "::error::  git merge origin/$src"
            echo "::error::  # fix the break, then:"
            echo "::error::  git add -u && git commit --amend --no-edit"
            echo "::error::  cargo build --workspace --tests   # verify the fix"
            echo "::error::  # once it builds, then: git push origin $tgt"
          }

          for TARGET in "${TARGETS[@]}"; do
            echo "::group::Verify $CURRENT → $TARGET"
            TARGET_SHA=$(git rev-parse "origin/$TARGET" 2>/dev/null || echo "")
            CURRENT_SHA=$(git rev-parse "origin/$CURRENT")

            if [[ "$TARGET_SHA" == "$CURRENT_SHA" ]]; then
              echo "Target $TARGET already up to date"
              echo "::endgroup::"
              continue
            fi

            if ! FETCH_ERR=$(git fetch origin "$CURRENT" "$TARGET" 2>&1); then
              echo "::error::Cascade halted: failed to fetch $CURRENT/$TARGET from origin: $FETCH_ERR"
              echo "::endgroup::"
              HALTED="fetch failure for $CURRENT/$TARGET"
              break
            fi
            git checkout -q "origin/$TARGET"

            if ! git merge --no-commit --no-ff "origin/$CURRENT" 2>/dev/null; then
              if ! git merge --abort; then
                echo "::error::git merge --abort failed after conflict detection — workspace may be in an inconsistent state"
              fi
              bail_on_conflict "$CURRENT" "$TARGET"
              echo "::error::Cascade halted: conflict merging $CURRENT into $TARGET"
              echo "::endgroup::"
              HALTED="conflict at $TARGET"
              break
            fi

            git merge --abort || true

            git checkout -q "origin/$TARGET"
            git merge --no-edit "origin/$CURRENT"

            # Validate the merge result actually builds before handing it off.
            # A clean textual merge is not proof the code compiles.
            # --locked: pin to the merge's own committed Cargo.lock rather than
            # letting cargo silently resolve newer, unreviewed dependency
            # versions (and their build.rs/proc-macros) at merge time. This
            # job has no write token, so a compromised build here can't push
            # anything — but keep --locked anyway: unreviewed dependency
            # resolution shouldn't gate what forward-merge pushes either.
            # This checks only the default host target, not the release
            # build matrix's musl/macOS cross targets — acceptable today
            # since the workspace has no platform-cfg'd code path, but
            # worth revisiting if that changes.
            if ! cargo build --workspace --tests --locked; then
              bail_on_build_failure "$CURRENT" "$TARGET"
              echo "::error::Cascade halted: build failure after merging $CURRENT into $TARGET"
              echo "::endgroup::"
              HALTED="build failure at $TARGET"
              break
            fi

            MERGE_SHA=$(git rev-parse HEAD)
            SAFE_TARGET=${TARGET//\//_}
            mkdir -p "bundles/$SAFE_TARGET"
            # Bundle everything reachable from the merge commit that target
            # doesn't already have. forward-merge unbundles this and pushes
            # $MERGE_SHA — it never re-runs the merge or the build.
            git bundle create "bundles/$SAFE_TARGET/merge.bundle" "$TARGET_SHA..HEAD"
            echo "$TARGET_SHA" > "bundles/$SAFE_TARGET/base.sha"
            echo "$MERGE_SHA" > "bundles/$SAFE_TARGET/merge.sha"
            echo "$TARGET" > "bundles/$SAFE_TARGET/target.txt"
            VERIFIED+=("$TARGET")

            echo "::endgroup::"
          done

          emit_outputs

          if [[ -n "$HALTED" ]]; then
            echo "Verify cascade halted ($HALTED); downstream targets not verified"
            # Exit 0 even on halt: whatever verified successfully before the
            # halt point still needs to reach forward-merge and get pushed,
            # matching the pre-split behavior where earlier targets in the
            # loop were pushed before a later target's failure stopped the
            # cascade. forward-merge re-reports this halt (via the `halted`
            # output) as its own failure once it's pushed what it can.
            exit 0
          fi

          echo "Verify cascade completed"

      - name: Upload merge bundles
        if: steps.cascade.outputs.verified_targets != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forward-merge-bundles
          path: bundles/
          retention-days: 1
          if-no-files-found: error

  # Pushes exactly what verify-merge verified — never re-merges, never builds,
  # never executes anything from the merged tree. This is the only job with
  # write credentials, so it's also the only job that must never run
  # untrusted code (#616).
  forward-merge:
    needs: verify-merge
    runs-on: ubuntu-latest
    # Intentionally no actor filter: CI-initiated pushes (auto-commit version
    # bumps from the release workflow) must also trigger the forward-merge
    # cascade so the release branch stays in sync with main.
    permissions:
      contents: write
      pull-requests: write
    env:
      CURRENT: ${{ needs.verify-merge.outputs.current }}
      VERIFIED_TARGETS: ${{ needs.verify-merge.outputs.verified_targets }}
      VERIFY_HALTED: ${{ needs.verify-merge.outputs.halted }}
      GH_TOKEN: ${{ github.token }}
      # A PAT with workflow scope allows pushing merge commits that touch
      # .github/workflows/ — the built-in GITHUB_TOKEN cannot. Injected per
      # push via `-c http.extraheader` (see push_sha_to_target below) instead
      # of `git remote set-url`, which would write it in cleartext into
      # .git/config for the rest of the job.
      FORWARD_MERGE_PAT: ${{ secrets.FORWARD_MERGE_PAT }}
    steps:
      - name: Checkout
        if: needs.verify-merge.outputs.verified_targets != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download merge bundles
        if: needs.verify-merge.outputs.verified_targets != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forward-merge-bundles
          path: bundles/

      - name: Push verified merges
        if: needs.verify-merge.outputs.verified_targets != ''
        run: |
          set -euo pipefail

          # Both push helpers below capture stderr instead of discarding it,
          # so a real git error (bad PAT, rate limit, stale
          # --force-with-lease) is distinguishable from the
          # branch-protection / workflow-permission case the caller falls
          # back on — previously all failures looked identical to the
          # caller.
          #
          # When FORWARD_MERGE_PAT is set, it's injected as a `-c
          # http.extraheader` override scoped to this single git invocation
          # rather than written to .git/config, so it never sits on disk.
          push_sha_to_target() {
            local sha="$1" target="$2" err
            local -a auth=()
            if [[ -n "${FORWARD_MERGE_PAT:-}" ]]; then
              auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(
                printf 'x-access-token:%s' "$FORWARD_MERGE_PAT" | base64 -w0
              )")
            fi
            err=$(git "${auth[@]}" push origin "$sha":"$target" 2>&1) && return 0
            echo "::warning::push_sha_to_target failed ($sha -> $target): $err"
            return 1
          }

          force_push_branch() {
            local branch="$1" err
            local -a auth=()
            if [[ -n "${FORWARD_MERGE_PAT:-}" ]]; then
              auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(
                printf 'x-access-token:%s' "$FORWARD_MERGE_PAT" | base64 -w0
              )")
            fi
            err=$(git "${auth[@]}" push origin "$branch" --force-with-lease 2>&1) && return 0
            echo "::warning::force_push_branch failed ($branch): $err"
            return 1
          }

          bail_on_stale_target() {
            local target="$1" expected="$2" actual="$3"
            echo "::error::$target changed since verify-merge ran (expected $expected, now $actual) — the verified merge no longer applies. Re-run this workflow run"
            echo "::error::(Actions tab -> this run -> Re-run all jobs) so verify-merge re-verifies against $target's current state."
          }

          HALTED=""

          while IFS= read -r TARGET; do
            [[ -z "$TARGET" ]] && continue
            echo "::group::Push $CURRENT → $TARGET"

            SAFE_TARGET=${TARGET//\//_}
            BASE_SHA=$(cat "bundles/$SAFE_TARGET/base.sha")
            MERGE_SHA=$(cat "bundles/$SAFE_TARGET/merge.sha")

            if ! FETCH_ERR=$(git fetch origin "$TARGET" 2>&1); then
              echo "::error::Cascade halted: failed to fetch $TARGET from origin: $FETCH_ERR"
              echo "::endgroup::"
              HALTED="fetch failure for $TARGET"
              break
            fi
            CURRENT_TARGET_SHA=$(git rev-parse "origin/$TARGET")

            # TOCTOU guard: if $TARGET moved since verify-merge built this
            # bundle against $BASE_SHA, the verified merge no longer applies
            # cleanly — pushing it could silently drop whatever landed on
            # $TARGET in between. git's own non-fast-forward rejection would
            # likely catch this too, but check explicitly for a clear error
            # instead of relying on that as the only guard.
            if [[ "$CURRENT_TARGET_SHA" != "$BASE_SHA" ]]; then
              bail_on_stale_target "$TARGET" "$BASE_SHA" "$CURRENT_TARGET_SHA"
              echo "::endgroup::"
              HALTED="stale target $TARGET"
              break
            fi

            git bundle unbundle "bundles/$SAFE_TARGET/merge.bundle" >/dev/null

            # Land the merge directly so the fix propagates automatically — main
            # is the final target and is forward-merged the same way as every
            # release branch, with no manual step. If a target is branch-protected
            # the push is rejected; fall back to opening a PR and halt so the
            # remaining (now un-merged) targets aren't silently skipped.
            if push_sha_to_target "$MERGE_SHA" "$TARGET"; then
              echo "Pushed directly to $TARGET"
            else
              MERGE_BRANCH="forward-merge/$CURRENT-to-$TARGET"
              git checkout -B "$MERGE_BRANCH" "$MERGE_SHA"

              if force_push_branch "$MERGE_BRANCH"; then
                # The default GITHUB_TOKEN cannot create pull requests
                # ("GitHub Actions is not permitted to create or approve
                # pull requests") — that's the exact gap FORWARD_MERGE_PAT
                # exists to route around, same as the push helpers above.
                # Without this override, gh reads GH_TOKEN from the step env
                # (pinned to github.token) and hits that wall every time
                # (#683). Check the exit status instead of asserting success
                # unconditionally — the PAT can still lack PR-creation scope.
                if GH_TOKEN="${FORWARD_MERGE_PAT:-$GH_TOKEN}" gh pr create --base "$TARGET" --head "$MERGE_BRANCH" \
                  --title "Forward-merge $CURRENT into $TARGET" \
                  --body "Direct push to $TARGET blocked by branch protection; opening PR."; then
                  echo "::error::Cascade halted: $TARGET is protected, opened PR instead"
                else
                  echo "::error::Cascade halted: $TARGET is protected and PR creation failed. Resolve manually:"
                  echo "::error::  git fetch origin && git checkout $TARGET && git reset --hard origin/$TARGET"
                  echo "::error::  git merge origin/$MERGE_BRANCH"
                  if [[ -n "${FORWARD_MERGE_PAT:-}" ]]; then
                    echo "::error::FORWARD_MERGE_PAT is configured but PR creation still failed —"
                    echo "::error::if the git push above succeeded, the PAT likely lacks the"
                    echo "::error::'Pull requests: write' scope. Add it and reissue the PAT."
                  fi
                fi
                echo "::endgroup::"
                HALTED="protected branch $TARGET"
              else
                echo "::error::Cascade halted: cannot push merge commit to $TARGET"
                echo ""
                if [[ -z "${FORWARD_MERGE_PAT:-}" ]]; then
                  echo "No FORWARD_MERGE_PAT is configured, so this push carried no"
                  echo "credentials at all (checkout no longer persists GITHUB_TOKEN)."
                  echo "This fails for every target, not just ones touching"
                  echo ".github/workflows/ — create a fine-grained PAT scoped to this"
                  echo "repository only (Contents: read/write, Workflows: read/write,"
                  echo "Pull requests: read/write, with an expiry) at:"
                else
                  echo "FORWARD_MERGE_PAT is configured but the push still failed — see"
                  echo "the ::warning:: above for the underlying git error (expired token,"
                  echo "missing Workflows scope, or similar). Reissue the PAT at:"
                fi
                echo "  https://github.com/settings/personal-access-tokens/new"
                echo "A classic PAT also works but needs the \`workflow\` scope, which"
                echo "on GitHub implies full \`repo\` and is account-wide — avoid it"
                echo "unless fine-grained tokens aren't an option. Store it as"
                echo "FORWARD_MERGE_PAT:"
                echo "  https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions"
                echo ""
                echo "Then re-run this workflow."
                echo "::endgroup::"
                HALTED="push blocked on $TARGET"
              fi
              break
            fi

            echo "::endgroup::"
          done <<< "$VERIFIED_TARGETS"

          # Re-report a verify-side halt (conflict/build failure on a target
          # past the ones we just pushed) as this job's own failure, now that
          # everything verify-merge did manage to verify has been pushed.
          if [[ -n "$HALTED" ]]; then
            echo "Push cascade halted ($HALTED)"
            exit 1
          fi
          if [[ -n "$VERIFY_HALTED" ]]; then
            echo "::error::Verify cascade halted ($VERIFY_HALTED); downstream targets not verified"
            exit 1
          fi

          echo "Forward-merge cascade completed"

      - name: Report verify-side halt with nothing to push
        if: needs.verify-merge.outputs.verified_targets == '' && needs.verify-merge.outputs.halted != ''
        run: |
          set -euo pipefail
          echo "::error::Verify cascade halted (${VERIFY_HALTED}); nothing was verified, nothing pushed"
          exit 1
