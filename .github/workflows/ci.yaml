name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Stage 1: Fast lint ─────────────────────────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all --check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  pre-commit-config-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .pre-commit-config.yaml parses
        run: |
          python3 -m pip install --quiet 'pyyaml==6.0.3'
          python3 -c "import yaml; yaml.safe_load(open('.pre-commit-config.yaml'))"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint charts
        run: |
          helm lint charts/servarr-crds/ --set operatorNamespace=servarr
          helm lint charts/servarr-operator/
          helm dependency build charts/servarr-operator/
          helm template test charts/servarr-crds/ --set operatorNamespace=servarr > /dev/null
          helm template test charts/servarr-crds/ --set webhook.enabled=false > /dev/null
          helm template test charts/servarr-operator/ > /dev/null
          helm template test charts/servarr-operator/ --set watchAllNamespaces=true > /dev/null

  image-defaults-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check image defaults are in sync
        run: bash scripts/sync-image-defaults.sh && git diff --exit-code charts/servarr-operator/values.yaml

  # ── Stage 2: Analysis + Tests ──────────────────────────────────────────
  clippy:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  hawk:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `cargo hawk check` builds into its own target dir, not the default `target/`
          # (see the --target-dir flag on the run step below). Name that dir here so
          # rust-cache saves it and prunes it the same way it prunes a normal target dir.
          # Without this line the job caches the registry only, and recompiles the whole
          # dependency graph on every run. (#728)
          workspaces: . -> target/hawk

      - name: Install rustc-dev components
        # cargo-hawk hooks compiler internals (rustc_interface, rustc_lexer, ...),
        # which the default toolchain profile doesn't ship.
        run: rustup component add rustc-dev llvm-tools-preview

      - name: Install cargo-hawk
        # Unpinned on purpose: cargo-hawk hooks unstable rustc-internal APIs, so a
        # binary built against one toolchain often won't even compile against the next. A
        # pinned version left CI red every time Renovate bumped rust-toolchain.toml until
        # someone noticed and bumped this pin separately. Floating to latest always builds
        # against whatever cargo-hawk release is current for the active toolchain — matches
        # how cargo-deny and cargo-llvm-cov are installed below (also unpinned).
        run: RUSTC_BOOTSTRAP=1 cargo install --locked cargo-hawk

      - name: Run cargo-hawk
        # servarr_api and servarr_crds are excluded: their pub surface is a genuine
        # cross-crate boundary consumed by sibling workspace crates, not dead code.
        #
        # --target-dir keeps the instrumented build in a reusable directory. cargo-hawk
        # otherwise builds into a temporary directory that is discarded when the run ends,
        # so nothing survives for the cache step above to save. (#728)
        #
        # unnecessary_public is -D: the backlog is clear, so any new finding is a real
        # regression and must block. unnecessary_restricted_visibility stays -W because one
        # finding is permanent by design -- SeerrServerSettings must keep the same visibility
        # as the SeerrAppKind::Server associated type it bounds, or rustc's private_bounds
        # warning fires instead. See the comment on that trait in controller/cleanup.rs.
        run: cargo hawk check --manifest-path Cargo.toml --target-dir target/hawk --exclude-crate servarr_api --exclude-crate servarr_crds -D hawk::unnecessary_public -W hawk::unnecessary_restricted_visibility

  deny:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  smoke-test:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    # Covers: docker build (compiles inside the container; no persisted
    # BuildKit cache in CI, so this is an uncached from-scratch build) + kind
    # cluster start + 17 media-stack deployments becoming ready (up to 360s
    # alone, per smoke-test.sh) + a credential check. 25m gives headroom
    # without letting a hung run block the required-checks queue indefinitely.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # smoke-test-local.sh derives the cluster name to `kind load
          # docker-image --name` from the kubectl context (strips a
          # leading "kind-"), so the context must be kind-kind, not this
          # action's own default context name kind-chart-testing.
          cluster_name: kind

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Reuses the same script a contributor can run locally
      # (scripts/smoke-test-local.sh, via `pre-commit run --hook-stage manual
      # smoke-test`), so CI and local runs exercise identical setup. The
      # script is manual-stage only, not part of the pre-push hook (#767) —
      # this job is a required check on main, but release/N.x branches have
      # no branch protection yet (#770), so treat it as advisory there until
      # that's fixed. This checks that the 17 media-stack app deployments
      # (bazarr, cleanuparr, houndarr, jackett, jellyfin, lidarr, ... — see
      # APP_PORTS in smoke-test.sh) reach Ready and that Jellyfin's admin credentials
      # authenticate; it is not a full end-to-end functional test of every
      # app's own behavior.
      - name: Run smoke test
        run: bash scripts/smoke-test-local.sh --namespace ci-smoke

  semgrep:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Semgrep
        run: |
          uv tool install 'semgrep==1.175.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # CodeQL has no Rust extractor, so Semgrep is the applicable SAST tool here.
      # p/secrets is the standard secrets baseline; p/rust and p/github-actions
      # scope the rest to this repo's actual languages (Rust source + this
      # directory of workflow files) rather than pulling in unrelated rulesets.
      #
      # These three rulesets are fetched from the Semgrep registry at run time, not
      # vendored — a push that passed yesterday can fail today with no code change here
      # if a rule changes upstream, and the reverse (a rule silently withdrawn) loses
      # coverage with no signal. Accepted tradeoff for now; vendoring them under version
      # control would remove it at the cost of manually pulling in rule updates.
      - name: Run Semgrep
        run: |
          semgrep --metrics=off --error \
            --config p/secrets --config p/rust --config p/github-actions .

  shear:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-shear
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-shear

      # --check-test-targets is required: dev-dependencies used only from
      # crates/*/tests/ (proptest, HTTP mock crates) would otherwise be
      # false-flagged as unused, since a source-only scan skips test targets.
      - name: Run cargo shear
        run: cargo shear --check-test-targets

  test:
    needs: [fmt, actionlint, zizmor, pre-commit-config-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov

      - name: Check the coverage gate script
        run: bash scripts/check-coverage_test.sh

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          mkdir -p .tmp
          cargo llvm-cov --workspace --json --output-path .tmp/coverage.json

      # Separate from the coverage run above, which is the only other test command in this
      # workflow. `cargo llvm-cov` skips doctests unless it is given --doctests, and that flag
      # is unstable. Without this step the compile_fail doctests never run in CI. Those
      # doctests are the guard that a raw &str cannot satisfy `impl Into<TenantSafeMessage>`,
      # so a From<&str> impl added later would defeat every tenant-safe Condition message with
      # nothing to catch it. (#744)
      - name: Run doctests
        run: cargo test --doc --workspace

      # Enforces the aggregate threshold and the per-file floors from the report above, so
      # coverage is measured once. Its exit status is the step's status — no pipe, no tee.
      - name: Enforce coverage gates
        run: |
          # pipefail is required, not decorative: without it the tee masks the gate's exit
          # code and the whole check becomes a no-op, which is what #70 had to fix.
          set -euo pipefail
          bash scripts/check-coverage.sh .tmp/coverage.json | tee .tmp/coverage-summary.txt

      - name: Post coverage summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Code Coverage"
            echo ""
            echo '```'
            cat .tmp/coverage-summary.txt 2>/dev/null || echo "coverage did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
