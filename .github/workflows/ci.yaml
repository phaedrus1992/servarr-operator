name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Stage 1: Fast lint ─────────────────────────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all --check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@01d2dd67e3525e5a0ce72e8fa38e5a3ab65e2ded # v1.72.1

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint charts
        run: |
          helm lint charts/servarr-crds/ --set operatorNamespace=servarr
          helm lint charts/servarr-operator/
          helm dependency build charts/servarr-operator/
          helm template test charts/servarr-crds/ --set operatorNamespace=servarr > /dev/null
          helm template test charts/servarr-crds/ --set webhook.enabled=false > /dev/null
          helm template test charts/servarr-operator/ > /dev/null
          helm template test charts/servarr-operator/ --set watchAllNamespaces=true > /dev/null

  image-defaults-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check image defaults are in sync
        run: bash scripts/sync-image-defaults.sh && git diff --exit-code charts/servarr-operator/values.yaml

  # ── Stage 2: Analysis + Tests ──────────────────────────────────────────
  clippy:
    needs: [fmt, actionlint, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  hawk:
    needs: [fmt, actionlint, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Cache cargo-hawk binary
        id: cargo-hawk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hawk
          key: cargo-hawk-0.1.12-${{ runner.os }}

      - name: Install cargo-hawk
        if: steps.cargo-hawk-cache.outputs.cache-hit != 'true'
        run: RUSTC_BOOTSTRAP=1 cargo install --locked --version 0.1.12 cargo-hawk

      - name: Run cargo-hawk
        # servarr_api and servarr_crds are excluded: their pub surface is a genuine
        # cross-crate boundary consumed by sibling workspace crates, not dead code.
        # Non-blocking (no -D) until the existing findings are triaged — see #568/#569.
        run: cargo hawk check --manifest-path Cargo.toml --exclude-crate servarr_api --exclude-crate servarr_crds -W hawk::unnecessary_public -W hawk::unnecessary_restricted_visibility

  test:
    needs: [fmt, actionlint, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          set -o pipefail  # propagate cargo-llvm-cov's exit code through the tee pipe
          threshold=$(cat .coverage-threshold)
          cargo llvm-cov --workspace --fail-under-lines "$threshold" --summary-only 2>&1 | tee /tmp/coverage-summary.txt

      - name: Post coverage summary
        if: always()
        run: |
          {
            echo "### Code Coverage"
            echo ""
            echo '```'
            tail -5 /tmp/coverage-summary.txt
            echo '```'
            echo ""
            echo "Threshold: $(cat .coverage-threshold)% lines"
          } >> "$GITHUB_STEP_SUMMARY"
