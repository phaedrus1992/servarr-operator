[package]
name = "servarr-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
kube.workspace = true
k8s-openapi.workspace = true
overseerr = "0.1"
sonarr = "0.1.1"
radarr = "0.1.1"
lidarr = "0.1.1"
prowlarr = "0.1.1"

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = { workspace = true }
# Test-only independent base64 decoder (already in the workspace graph via
# servarr-operator) — lets the auth-header roundtrip proptest decode against a
# separate implementation rather than the module's own Base64Writer.
base64 = "=0.22.1"
