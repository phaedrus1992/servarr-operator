[package]
name = "servarr-crds"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "=2.14.1", features = ["serde"] }
# Only for the TenantSafeMessage newtype -- Condition::fail (#668) takes one so the
# sanitized-string guarantee is enforced by the compiler, not just convention.
servarr-api = { path = "../servarr-api" }

[build-dependencies]
toml = "=1.1.4"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_yaml.workspace = true
proptest = { workspace = true }
